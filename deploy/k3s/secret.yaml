# Defing 集群 Secret（值须在部署时生成并替换，勿把真实值提交入库）。
#
# 生成命令（一次性）：
#   kubectl create namespace defing
#   kubectl -n defing create secret generic defing-secrets \
#     --from-literal=admin-password='<强密码≥12位>' \
#     --from-literal=cluster-token="$(openssl rand -hex 32)" \
#     --from-file=master.key=<(openssl rand -base64 32 | base64 -d)
# 说明：
#   - admin-password：--admin-password（登录 Admin UI / API）
#   - cluster-token：--join-token 与 --raft-token 共用（集群内所有节点必须相同）
#   - master.key：raw 32B 主密钥（Secret data 里是 base64(32B raw)；
#     挂载后文件为 raw 32B，即 --master-key-file 期望格式）。
#     defing --gen-master-key 可生成 base64 32B。
apiVersion: v1
kind: Secret
metadata:
  name: defing-secrets
  namespace: defing
type: Opaque
stringData:
  admin-password: "<ADMIN_PASSWORD>"
  cluster-token: "<CLUSTER_TOKEN_≥32字符>"
data:
  master.key: "<BASE64_OF_RAW_32B>"
