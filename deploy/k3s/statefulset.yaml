# Defing 3 节点 Raft 集群 StatefulSet。
# 说明：
#   - image 替换为实际镜像（构建：docker build -f deploy/Dockerfile -t <registry>/defing:v0.1.0 .，上下文=仓库根）
#   - 镜像 ENTRYPOINT=/docker-entrypoint.sh（root 时 chown /data 并 su-exec 降权；非 root 直接 exec）
#   - ConfigMap 脚本无执行位，经 sh 调用
#   - 探针：/healthz 存活；/readyz 就绪（raft 有日志才 200，天然门控追平/建群时序）
#   - 升级：PDB minAvailable=2 保证任意时刻至多 1 Pod 下线（不丢 quorum）；保守可改 OnDelete
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: defing
  namespace: defing
  labels: { app: defing }
spec:
  serviceName: defing
  replicas: 3
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels: { app: defing }
  template:
    metadata:
      labels: { app: defing }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8384"
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: defing }
      securityContext:
        fsGroup: 10001
      containers:
        - name: defing
          image: <registry>/defing:v0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/docker-entrypoint.sh"]
          args: ["sh", "/scripts/k3s-entrypoint.sh"]
          ports:
            - { name: http, containerPort: 8384 }
            - { name: grpc, containerPort: 8383 }
            - { name: raft, containerPort: 8385 }
          env:
            - name: SEED_NODES
              value: "3"
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: secrets, mountPath: /etc/defing, readOnly: true }
            - { name: entrypoint, mountPath: /scripts, readOnly: true }
      volumes:
        - name: secrets
          secret:
            secretName: defing-secrets
            defaultMode: 0444
        - name: entrypoint
          configMap:
            name: defing-entrypoint
            defaultMode: 0444
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests: { storage: 5Gi }
