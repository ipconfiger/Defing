<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Defing 配置中心</title>
<style>
body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 900px; }
input, select, button { padding: .4rem .6rem; margin: .2rem; }
pre { background: #f6f8fa; padding: 1rem; border-radius: 6px; overflow: auto; }
#events { height: 160px; overflow: auto; border: 1px solid #ddd; padding: .5rem; font-size: .85rem; }
</style>
</head>
<body>
<h1>Defing 配置中心 <small>(单管理员会话 I7)</small></h1>
<section>
  <input id="token" placeholder="管理员 Token" size="40">
  <button onclick="refreshProjects()">加载项目</button>
  <span id="msg"></span>
</section>
<hr>
<section>
  <h3>项目</h3>
  <select id="project"></select>
  <select id="branch"><option>dev</option><option>test</option><option>prod</option></select>
  <button onclick="loadConfig()">查看配置</button>
  <button onclick="startWatch()">订阅变更</button>
</section>
<pre id="config">（选择项目后查看）</pre>
<h3>变更事件</h3>
<div id="events"></div>
<script>
let es = null;
function auth() {
  return { 'Authorization': 'Bearer ' + document.getElementById('token').value.trim() };
}
async function jget(url) {
  const r = await fetch(url, { headers: auth() });
  if (!r.ok) { document.getElementById('msg').textContent = 'HTTP ' + r.status; throw new Error(r.status); }
  return r.json();
}
async function refreshProjects() {
  const ps = await jget('/api/v1/projects');
  const sel = document.getElementById('project');
  sel.innerHTML = '';
  for (const p of ps) {
    const o = document.createElement('option');
    o.value = p.name; o.textContent = p.name;
    sel.appendChild(o);
  }
  document.getElementById('msg').textContent = '已加载 ' + ps.length + ' 个项目';
}
async function loadConfig() {
  const p = document.getElementById('project').value;
  const b = document.getElementById('branch').value;
  if (!p) return;
  const c = await jget('/api/v1/projects/' + p + '/branches/' + b + '/config');
  document.getElementById('config').textContent = JSON.stringify(c, null, 2);
}
function startWatch() {
  const p = document.getElementById('project').value;
  const b = document.getElementById('branch').value;
  if (es) es.close();
  const token = document.getElementById('token').value.trim();
  es = new EventSource('/v1/projects/' + p + '/branches/' + b + '/watch');
  const box = document.getElementById('events');
  box.textContent = '订阅 ' + p + '/' + b + ' ...\n';
  es.onmessage = (ev) => { box.textContent += ev.data + '\n'; box.scrollTop = box.scrollHeight; };
}
refreshProjects();
</script>
</body>
</html>
