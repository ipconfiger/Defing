[package]
name = "dsh-raft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Defing config service - openraft integration (module 03)"

[dependencies]
dsh-core = { path = "../dsh-core" }
dsh-storage = { path = "../dsh-storage" }
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
# 表类型/事务操作需直接 use redb（Database/WriteTransaction/ReadableTable 等）
redb = "4.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
