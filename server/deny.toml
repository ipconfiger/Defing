# cargo-deny 配置（CI deny step；供应链接管：许可 + 依赖 + 漏洞）
# cargo-deny 0.20 格式（模板见 cargo-deny crate deny.template.toml）

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "warn"  # workspace 内部 path 依赖视为合法

[sources]
unknown-registry = "deny"
unknown-git = "deny"
